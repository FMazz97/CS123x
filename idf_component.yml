name: "cs123x"
version: "2.0.1"
description: "Driver for Chipsea CS1237 and CS1238 24-bit differential ADCs (weigh scales, load cells, bridge sensor). Features full PGA control, flexible sampling, scale calibration, temperature sensing, and offset diagnostics."
url: "https://github.com/FMazz97/CS123x"
repository: "https://github.com/FMazz97/CS123x.git"
documentation: "https://github.com/FMazz97/CS123x#readme"
issues: "https://github.com/FMazz97/CS123x/issues"

examples:
  - path: ./examples/simple_scale
  - path: ./examples/simple_temperature
  - path: ./examples/test_basic
  - path: ./examples/test_exhaustive
  - path: ./examples/test_gaussian

files:
  exclude:
    - "src/CS123x.h"
    - "src/hal/cs123x_hal_arduino.h"
    - "keywords.txt"
    - "library.json"
    - "library.properties"
    - "assets/**"
    - "examples/Arduino/**"

maintainers:
  - "FMazz97"

dependencies:
  idf: ">=5.0"
