; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main

[env:esp32dev]
framework = espidf
platform = espressif32@6.4.0 ;IDF 5.1.1 / CMake 3.24
board = esp32dev
monitor_speed = 115200
monitor_filters = direct

; library dependency:
lib_deps = fmazz97/cs123x@^2.0.0
; or, for local deployment:
; lib_deps = symlink://../path/to/cs123x

; the project works fine also without a PlatformIO dependency
; through the IDF component manager (main/idf_component.yml) manifest.
; for more details see:
; https://github.com/FMazz97/arduino-espidf-dual-library-guide/blob/main/chapters/04-examples.md#43-platformio-component-manager-and-cmake-are-independent-dependency-resolution-systems