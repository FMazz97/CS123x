; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main

[env:esp32dev]
framework = espidf
platform = espressif32@6.4.0 ;IDF 5.1.1 / CMake 3.16.4
board = esp32dev
monitor_speed = 115200
monitor_filters = direct

; PlatformIO dependency:
lib_deps = 
    fmazz97/cs123x@^2.0.0
    ; symlink://../.. ; for local deployment

; EPS-IDF Dependency
; the project works fine also without a PlatformIO dependency
; through the IDF Component Manager.
;
; main/idf_component.yml:
; dependencies:
;   fmazz97/cs123x:
;     version: "*"
;     override_path: "../../../" #for local deployment
;
; for more details see:
; https://github.com/FMazz97/arduino-espidf-dual-library-guide/blob/main/chapters/04-examples.md#43-platformio-component-manager-and-cmake-are-independent-dependency-resolution-systems